name: Build, test and distribute

on:
  push:
    branches: [main, master, devel, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to build and publish (blank only builds the selected ref)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.workflow }}-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.release_tag == '' }}

jobs:
  prepare:
    name: Validate publication and resolve sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate the requested version
        id: version
        shell: pwsh
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_REF_TYPE: ${{ github.ref_type }}
          BUILD_REF_NAME: ${{ github.ref_name }}
          BUILD_EVENT: ${{ github.event_name }}
        run: |
          $tag = ''
          if ($env:BUILD_EVENT -eq 'workflow_dispatch') {
            $tag = $env:REQUESTED_RELEASE_TAG
          } elseif ($env:BUILD_EVENT -eq 'push' -and $env:BUILD_REF_TYPE -eq 'tag') {
            $tag = $env:BUILD_REF_NAME
          }
          if ($tag -and $tag -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$') {
            throw 'Release tags must have the form v2.1.0 or v2.1.0-rc.1.'
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Check out publication tools from the selected workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: workflow-source

      - name: Test release creation and retries without publishing
        run: python3 -m unittest discover -s workflow-source/.github/scripts -p test_publish_distribution.py -v

      - name: Resolve the version's source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          persist-credentials: false
          path: source

      - name: Pin the source commit for both platforms
        id: source
        working-directory: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Test and package (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboardtemplate/package-lock.json

      - name: Set up Gradle and validate the wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Build, test and package
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          $gradleArguments = @(
            'clean', 'test', ':scraping:browserSmokeTest', ':app:installDist', ':app:distZip',
            '-Pbrowser=CHROME', '--no-daemon', '--stacktrace', '--console=plain'
          )
          if ($env:RELEASE_TAG) {
            $gradleArguments += '-PreleaseVersion=' + $env:RELEASE_TAG.Substring(1)
          }
          if ($IsWindows) {
            & .\gradlew.bat @gradleArguments
          } else {
            & bash ./gradlew @gradleArguments
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise the installed CLI with Chrome
        run: |
          & ./.github/scripts/Test-Distribution.ps1 `
            -DistributionPath ./app/build/install/QaRobot `
            -OutputPath ./build/ci-smoke

      - name: Collect test reports and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            */build/reports/tests/
            */build/test-results/
            build/ci-smoke/
          if-no-files-found: warn
          retention-days: 14

      # Both platforms validate the package; Linux supplies the portable release ZIP.
      - name: Calculate the distribution checksum
        if: runner.os == 'Linux'
        run: |
          $archives = @(Get-ChildItem -LiteralPath app/build/distributions -Filter 'QaRobot-*.zip' -File)
          if ($archives.Count -ne 1) { throw 'Expected exactly one QaRobot distribution ZIP.' }
          $hash = (Get-FileHash -LiteralPath $archives[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($archives[0].Name)" | Set-Content -LiteralPath app/build/distributions/SHA256SUMS.txt -Encoding utf8NoBOM

      - name: Save the downloadable distribution
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QaRobot-distribution
          path: |
            app/build/distributions/QaRobot-*.zip
            app/build/distributions/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish the tagged distribution
    needs: [prepare, build]
    if: needs.prepare.outputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out publication tools from the selected workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the tested distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: QaRobot-distribution
          path: release-assets

      - name: Verify and publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          python3 .github/scripts/publish_distribution.py --tag "$RELEASE_TAG" --assets release-assets
